<mat-toolbar color="primary">
  <span>🏢 Conjuntos Residenciales</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="cerrarSesion()" title="Cerrar sesión">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="dashboard-container">
  <h1>👋 Bienvenido, {{ nombreUsuario }}</h1>
  <p class="subtitulo">¿Qué deseas hacer hoy?</p>

  <div class="cards-grid">

    <mat-card class="opcion-card" (click)="irAReservas()">
      <mat-card-content>
        <mat-icon class="card-icon">event</mat-icon>
        <h2>Mis Reservas</h2>
        <p>Reserva zonas comunes como el salón social, piscina o gimnasio</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary">Ver Reservas</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="opcion-card" (click)="irAPQRS()">
      <mat-card-content>
        <mat-icon class="card-icon">feedback</mat-icon>
        <h2>Mis PQRS</h2>
        <p>Radica peticiones, quejas, reclamos o sugerencias a la administración</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="accent">Ver PQRS</button>
      </mat-card-actions>
    </mat-card>

  </div>
</div>
