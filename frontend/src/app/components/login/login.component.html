<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>🏢 Conjuntos Residenciales</mat-card-title>
      <mat-card-subtitle>Inicia sesión en tu cuenta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" type="email" placeholder="tu@email.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">
            El correo es obligatorio
          </mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">
            Ingresa un correo válido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">
            La contraseña es obligatoria
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="full-width"
          type="submit"
          [disabled]="form.invalid || cargando">
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </mat-card-actions>
  </mat-card>
</div>
